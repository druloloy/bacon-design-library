name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      # Split so a failure names the category rather than "tests failed".
      - name: Unit tests
        run: npx jest tests/unit

      - name: Brand rule tests
        run: npx jest tests/brand

      - name: Component tests
        run: npx jest tests/components

      - name: Accessibility tests
        run: npx jest tests/accessibility

      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build the package
        run: npm run build

      # Runs against lib/, not src/: proves the *published* entry points and declarations work.
      - name: Package integration test
        run: |
          npx jest tests/integration
          npm run verify:package

  example:
    name: Example app typechecks against the built package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build the package
        run: |
          npm ci
          npm run build

      - name: Install the example app
        working-directory: example
        run: npm install

      # .storybook/index.tsx imports storybook.requires, which Storybook generates from the stories
      # and which is not committed. Generate it first, or the typecheck cannot resolve the import.
      - name: Generate Storybook stories
        working-directory: example
        run: npm run storybook:generate

      - name: Typecheck the example app
        working-directory: example
        run: npm run typecheck

  # Bacon is installed straight from GitHub rather than from npm, so this is the path every
  # consuming app takes. It proves the prepare script builds lib/ during a git install, and that a
  # consumer typechecks against what actually lands in node_modules. Push-only, because a pull
  # request from a fork has no commit this repository can install by SHA.
  #
  # It installs with the same git+https URL the docs give. Yarn Classic resolves the github:
  # shorthand to a tarball and never runs prepare, so testing the shorthand would test the wrong thing.
  github-install:
    name: Installs from GitHub with ${{ matrix.pm }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, yarn]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create an empty consumer project
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          cp "$GITHUB_WORKSPACE/scripts/consumer/consumer.tsx" .
          echo '{"compilerOptions":{"target":"esnext","lib":["esnext","dom"],"module":"esnext","moduleResolution":"bundler","jsx":"react-jsx","strict":true,"noEmit":true,"skipLibCheck":true,"esModuleInterop":true,"types":["react"]},"include":["consumer.tsx"]}' > tsconfig.json

      - name: Install Bacon from this commit on GitHub
        working-directory: ${{ runner.temp }}/consumer
        env:
          SPEC: git+https://github.com/${{ github.repository }}.git#${{ github.sha }}
          PEERS: react@18.2.0 react-native@0.73.6 react-native-safe-area-context@4.8.2 typescript@5.4.5 @types/react@18.2.79
        run: |
          if [ "${{ matrix.pm }}" = "yarn" ]; then
            yarn add "$SPEC" $PEERS
          else
            npm install "$SPEC" $PEERS --no-audit --no-fund
          fi

      - name: The installed package is complete and ships nothing extra
        working-directory: ${{ runner.temp }}/consumer
        run: bash "$GITHUB_WORKSPACE/scripts/check-installed-package.sh" node_modules/@druloloy/bacon-ui

      - name: A consumer typechecks against the installed package
        working-directory: ${{ runner.temp }}/consumer
        run: npx tsc -p tsconfig.json

      # Apps reinstall from their lockfile in their own CI. npm records Bacon in package-lock.json as a
      # git+ssh:// URL, and this runner has no GitHub SSH key, so this is exactly the case an app hits.
      - name: Reinstall from the lockfile
        working-directory: ${{ runner.temp }}/consumer
        run: |
          rm -rf node_modules
          if [ "${{ matrix.pm }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          else
            npm ci --no-audit --no-fund
          fi
          bash "$GITHUB_WORKSPACE/scripts/check-installed-package.sh" node_modules/@druloloy/bacon-ui
