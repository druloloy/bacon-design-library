name: Release

# Bacon is installed from GitHub, not from npm, so a release is a git tag plus a GitHub Release.
# Apps pin to the tag:  "@druloloy/bacon-ui": "github:druloloy/bacon-design-library#v1.2.0"
#
# To cut a release: bump "version" in package.json, add a matching "## [x.y.z]" section to
# CHANGELOG.md, commit, then push a tag named v<version>. This workflow refuses to publish a
# release whose tag, package.json version and CHANGELOG entry disagree.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Verify and create the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Full verification
        run: npm run verify

      - name: Tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/        { exit }
            found                    { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no \"## [$VERSION]\" section"
            exit 1
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Bacon $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
